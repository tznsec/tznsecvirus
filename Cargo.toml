[package]
name = "tznsecvirus"
version = "2.0.0"
edition = "2021"
description = "TZNSECVIRUS - pelne skanowanie bezpieczenstwa komputera z analiza AI (Rust + WebView)"
authors = ["wojtek"]

[dependencies]
tao = "0.37.1"
wry = "0.57.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
ureq = { version = "3.4.2", features = ["json"] }
walkdir = "2.5.0"
dirs = "7.0.0"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 2
strip = true